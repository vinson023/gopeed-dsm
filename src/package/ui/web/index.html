<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A modern download manager.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gopeed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gopeed</title>
  <link rel="manifest" href="manifest.json">

  <!--
    DSM integration shim.

    This bundle is served by DSM's own nginx from /webman/3rdparty/gopeed/app/,
    i.e. from the DSM origin itself. That is mandatory: DSM sends
    `frame-src 'self'`, and 'self' includes the port, so an iframe pointing at
    http://nas:38099 (a different origin) is refused and the window stays blank.

    The REST engine still listens on 38099, so API calls are routed through
    /webman/3rdparty/gopeed/api.cgi/<path> - a CGI that DSM executes in this
    same directory and that forwards to 127.0.0.1:38099. Everything therefore
    stays on one origin, which is why it works over http and https alike, with
    no certificate, no TLS tunnel and no CORS.
  -->
  <script>
  (function () {
    // Older builds registered Flutter's service worker here; it caches the
    // asset list and would keep serving a stale bundle. Remove it for good.
    try {
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        });
      }
    } catch (e) {}

    var API_CGI = "/webman/3rdparty/gopeed/api.cgi";

    function rewrite(u) {
      if (typeof u !== "string" || u.indexOf("api/") < 0) { return u; }
      if (u.indexOf("api.cgi") >= 0) { return u; }        // already routed
      var m = u.match(/^(?:https?:\/\/[^\/]*)?\/?(api\/.*)$/);
      return m ? API_CGI + "/" + m[1] : u;
    }

    var open = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      try { arguments[1] = rewrite(url); } catch (e) {}
      return open.apply(this, arguments);
    };

    if (window.fetch) {
      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        try {
          if (typeof input === "string") {
            input = rewrite(input);
          } else if (input && input.url) {
            var next = rewrite(input.url);
            if (next !== input.url) { input = new Request(next, input); }
          }
        } catch (e) {}
        return origFetch.call(this, input, init);
      };
    }

    if (window.EventSource) {
      var ES = window.EventSource;
      var PatchedES = function (url, cfg) { return new ES(rewrite(url), cfg); };
      PatchedES.prototype = ES.prototype;
      window.EventSource = PatchedES;
    }
  })();
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
